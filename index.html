<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WILLY 1v1 YOU</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        :root { --accent: #00d4ff; --bg: #0f0f0f; --panel: #1a1a1a; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        
        .main-layout { display: flex; gap: 20px; width: 950px; height: 600px; }
        
        /* Vertical Evaluation Bar */
        .eval-wrapper { width: 35px; background: #333; height: 100%; border-radius: 5px; position: relative; border: 1px solid #444; overflow: hidden; }
        #eval-fill { position: absolute; bottom: 0; width: 100%; height: 50%; background: #ffffff; transition: height 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
        .eval-label { position: absolute; width: 100%; text-align: center; font-size: 10px; color: #888; font-weight: bold; z-index: 2; top: 50%; transform: translateY(-50%); mix-blend-mode: difference; }

        /* Board Area */
        .board-container { flex: 2; position: relative; }
        #board { width: 100%; border: 4px solid #222; border-radius: 4px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        
        /* Sidebar */
        .sidebar { flex: 1; background: var(--panel); padding: 20px; border-radius: 8px; border: 1px solid #333; display: flex; flex-direction: column; }
        .header { margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .header h2 { margin: 0; font-size: 1.2rem; color: var(--accent); }
        .status-box { font-size: 0.85rem; color: #888; margin-top: 5px; height: 1.2em; }

        .move-history { flex-grow: 1; background: #0a0a0a; border: 1px solid #222; border-radius: 4px; padding: 10px; overflow-y: auto; font-family: 'Courier New', Courier, monospace; font-size: 0.9rem; margin-bottom: 20px; color: #ccc; }
        .move-history b { color: var(--accent); margin-right: 5px; }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s; font-size: 0.8rem; }
        .btn-full { grid-column: span 2; background: var(--accent); color: #000; }
        .btn-half { background: #333; color: #fff; }
        button:hover { filter: brightness(1.2); }
        
        .hint-text { font-size: 0.8rem; color: #00ff88; margin-top: 10px; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="main-layout">
    <!-- Evaluation Bar -->
    <div class="eval-wrapper">
        <div class="eval-label" id="eval-val">0.0</div>
        <div id="eval-fill"></div>
    </div>

    <!-- Chessboard -->
    <div class="board-container">
        <div id="board"></div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="header">
            <h2>WILLY 1v1</h2>
            <div id="status" class="status-box">ENGINE INITIALIZING...</div>
        </div>

        <div class="move-history" id="move-history"></div>

        <div id="hint-display" class="hint-text"></div>

        <div class="controls">
            <button class="btn-full" onclick="resetGame()">NEW GAME</button>
            <button class="btn-half" onclick="undoMove()">UNDO</button>
            <button class="btn-half" onclick="flipBoard()">FLIP</button>
            <button class="btn-full" style="background: #444; color: #00ff88;" onclick="getHint()">GET HINT</button>
        </div>
    </div>
</div>

<!-- JS Libraries -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

<script>
    var board = null;
    var game = new Chess();
    var engine = null;
    var engineReady = false;

    // Load Stockfish WASM
    function initEngine() {
        const sfUrl = 'https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js';
        fetch(sfUrl).then(r => r.text()).then(code => {
            const blob = new Blob([code], { type: 'application/javascript' });
            engine = new Worker(URL.createObjectURL(blob));
            
            engine.onmessage = function(e) {
                const line = e.data;

                // Handle Eval Parsing
                if (line.includes('score cp')) {
                    let cp = parseInt(line.split('score cp ')[1].split(' ')[0]);
                    if (game.turn() === 'b') cp = -cp;
                    updateEval(cp);
                } else if (line.includes('score mate')) {
                    let m = line.split('score mate ')[1].split(' ')[0];
                    updateEval(m > 0 ? 1000 : -1000);
                }

                // Handle Engine Move
                if (line.startsWith('bestmove')) {
                    const bestMove = line.split(' ')[1];
                    if ($('#hint-display').is(':visible') && $('#hint-display').data('waiting')) {
                        $('#hint-display').text("HINT: " + bestMove).data('waiting', false);
                    } else {
                        game.move({ from: bestMove.substring(0, 2), to: bestMove.substring(2, 4), promotion: 'q' });
                        board.position(game.fen());
                        updateUI();
                    }
                }
            };
            
            engine.postMessage('uci');
            engine.postMessage('setoption name Skill Level value 10');
            engineReady = true;
            $('#status').text("READY - YOUR MOVE");
        });
    }

    function updateEval(cp) {
        let score = (cp / 100).toFixed(1);
        $('#eval-val').text(score);
        let percent = 50 - (cp / 20); // Scale 1000cp to 100%
        percent = Math.max(5, Math.min(95, percent));
        $('#eval-fill').css('height', percent + '%');
    }

    function onDragStart(s, p) {
        if (game.game_over() || p.search(/^b/) !== -1 || !engineReady) return false;
    }

    function onDrop(source, target) {
        var move = game.move({ from: source, to: target, promotion: 'q' });
        if (move === null) return 'snapback';

        $('#hint-display').hide();
        updateUI();
        window.setTimeout(makeEngineMove, 250);
    }

    function makeEngineMove() {
        if (game.game_over()) return;
        $('#status').text("ENGINE CALCULATING...");
        engine.postMessage('position fen ' + game.fen());
        engine.postMessage('go depth 12');
    }

    function getHint() {
        if (game.game_over()) return;
        $('#hint-display').text("ANALYZING...").show().data('waiting', true);
        engine.postMessage('position fen ' + game.fen());
        engine.postMessage('go depth 15');
    }

    function updateUI() {
        // Move History
        let history = game.history({ verbose: true });
        let html = '';
        for (let i = 0; i < history.length; i++) {
            if (i % 2 === 0) html += `<b>${(i/2)+1}.</b> `;
            html += history[i].san + ' ';
            if (i % 2 !== 0) html += '<br>';
        }
        $('#move-history').html(html).scrollTop($('#move-history')[0].scrollHeight);

        // Status
        let status = 'Your Turn';
        if (game.in_checkmate()) status = 'Checkmate!';
        else if (game.in_draw()) status = 'Draw';
        else if (game.in_check()) status = 'Check!';
        $('#status').text(status.toUpperCase());
    }

    function undoMove() {
        game.undo(); // Undo engine
        game.undo(); // Undo user
        board.position(game.fen());
        updateUI();
        $('#hint-display').hide();
    }

    function resetGame() {
        game.reset();
        board.start();
        updateUI();
        $('#eval-fill').css('height', '50%');
        $('#eval-val').text('0.0');
        $('#hint-display').hide();
    }

    function flipBoard() { board.flip(); }

    board = Chessboard('board', {
        draggable: true,
        position: 'start',
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: () => board.position(game.fen()),
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    });

    initEngine();
</script>
</body>
</html>
